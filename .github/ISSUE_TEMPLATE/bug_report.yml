name: Bug report
description: Something does not work or looks different from the original game.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not attach game files or extracted assets; screenshots are fine.
  - type: input
    id: version
    attributes:
      label: VNRevival version
      description: Shown at the bottom of the main menu.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (AppImage)
        - Linux (tar.gz)
        - Built from source
    validations:
      required: true
  - type: input
    id: system-version
    attributes:
      label: System version
      placeholder: "Windows 11 24H2, macOS 15, Ubuntu 24.04…"
  - type: input
    id: game
    attributes:
      label: Game and edition
      placeholder: "Pure Mail, DVD edition"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Say where in the game, if it matters.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Console output
      description: If you can, start VNRevival from a terminal and paste what it prints.
      render: text
