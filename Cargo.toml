[workspace]
resolver = "3"
members = ["crates/vnr-core", "crates/vnr-adv2", "crates/vnrevival"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Yamato6"]
license = "MIT"
repository = "https://github.com/Yamato6/VNRevival"

[workspace.dependencies]
vnr-core = { path = "crates/vnr-core" }
vnr-adv2 = { path = "crates/vnr-adv2" }
# Format readers live in VNTools-rs. To work on both repos at once, see
# "Working on VNTools-rs at the same time" in the README.
overflow-adv2 = { git = "https://github.com/Yamato6/VNTools-rs" }
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
