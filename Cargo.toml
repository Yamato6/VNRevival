[workspace]
resolver = "3"
members = ["crates/adv2-formats", "crates/adv2-tool"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Yamato6"]
repository = "https://github.com/Yamato6/OpenADV2"

[workspace.dependencies]
adv2-formats = { path = "crates/adv2-formats" }
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
